name = "gratitude-journal"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Keep variables added in the Cloudflare dashboard when deploying.
keep_vars = true

# Cron runs in UTC. 18:00 UTC is 21:00 in Israel during summer time and
# 19:00 UTC is 21:00 in winter; the handler only sends when it is 21:00 in
# Israel, so exactly one of these fires a message each day.
[triggers]
crons = ["0 18 * * *", "0 19 * * *"]

[vars]
TIMEZONE = "Asia/Jerusalem"
SEND_HOUR = "21"
TEMPLATE_NAME = "gratitude_evening"
TEMPLATE_LANG = "he"
GRAPH_VERSION = "v23.0"

[[d1_databases]]
binding = "DB"
database_name = "gratitude-journal"
database_id = "acabf46c-3289-4f7e-ac0a-b5cfe43182c3"

[observability]
enabled = true
